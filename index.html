<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Equipe RastreiaJa">
    <meta name="description" content="Plataforma de rastreamento de entregas em tempo real">
    <meta name="keywords" content="rastreio, entrega, logistica, tempo real">
    <!-- O title foi mantido exatamente igual ao modelo da Imagem 02 -->
    <title>RastreiaJá Rastreamento de Encomendas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- <header> utilizado para agrupar o logotipo e o slogan principal -->
    <header>
        <!-- <h1> para o título principal da página (RastreiaJá) -->
        <h1>RastreiaJá</h1>
        <p>Rastreie sua encomenda em tempo real</p>
        
        <!-- <nav> utilizado para encapsular os links de navegação exigidos -->
        <nav>
            <a href="index.html">Nova consulta</a>
            <a href="#">Ajuda</a>
        </nav>
    </header>

    <!-- <main> engloba o conteúdo principal e exclusivo da página -->
    <main>
        <!-- <section> cria o bloco semântico das informações do rastreio -->
        <section class="container-rastreio">
            <!-- <h2> para identificar o código de rastreio na hierarquia -->
            <h2>Código de Rastreio: BR123456789</h2>
            
            <!-- <article> separa o evento/atualização, fazendo sentido de forma independente -->
            <article class="evento-rastreio">
                <!-- <h3> aplicados em Status, Localização e Previsão conforme exigência da Etapa 2, letra c -->
                <h3>Status: Em trânsito</h3>
                <p>Última atualização: 11/09/2026 14:32</p>
                <h3>Localização: São Paulo - SP</h3>
                <h3>Previsão de entrega: 13/09/2026</h3>
            </article>
        </section>
    </main>

    <!-- <footer> semântico para o rodapé contendo o copyright -->
    <footer>
        <p>&copy; 2026 RastreiaJá - Todos os direitos reservados</p>
    </footer>
</body>
</html>
